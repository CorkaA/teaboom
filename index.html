<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ананасовый улун - Teaboom</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <article class="product-card">
            <div class="product-card_gallery">
                <img class="product-card_image" id="product-image">
            </div>
            <div class="product-card_info">
                <span class="product-card_category" id="product-category"></span>
                <h1 class="product-card_title" id="product-title"></h1>

                <p class="product-card_briefly" id="product-briefly"></p>

                <div class="product-card_options">
                    <span class="options-label">Выберите вес</span>
                    <ul class="options-list" id="weight-options">

                    </ul>
                </div>

                <div class="product-card_meta">
                    <span class="article" id="product-article">арт. </span>
                </div>

                <div class="product-card_price-block">
                    <span class="old-price" id="old-price"></span>
                    <span class="price" id="price"></span>
                </div>

                <div class="offer-block">
                    <button class="btn-add-to-cart" id="add-to-cart">В корзину +</button>
                    <div class="note">Подготовим товар для Вас</div>
                </div>
            </div>
        </article>

        <section class="product-description">
            <div class="description-block">
                <h2 class="description-title">Описание</h2>
                <p class="description-text" id="product-description"></p>
            </div>

            <div class="description-block">
                <h2 class="description-title">Состав</h2>
                <p class="description-text" id="product-composition"></p>
            </div>

            <div class="description-block">
                <h2 class="description-title">Вкус</h2>
                <p class="description-text" id="product-taste"></p>
            </div>

            <div class="description-block">
                <h2 class="description-title">Полезные свойства</h2>
                <ul class="benefits-list" id="product-benefits-list">
                
                </ul>
            </div>
        </section>
    </main>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
