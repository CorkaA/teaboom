<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ананасовый улун - Teaboom</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <article class="product-card">
            <div class="product-card_gallery">
                <img src="images/ananasovij-ulun.jpg" alt="Ананасовый улун" class="product-card_image" id="product-image">
                <span class="product-card_badge">Ананасовый улун</span>
            </div>
            <div class="product-card_info">
                <span class="product-card_category" id="product-category"></span>
                <h1 class="product-card_title" id="product-title"></h1>

                <p class="product-card_briefly" id="product-briefly"></p>

                <div class="product-card_options">
                    <span class="options-label">Выберите вес</span>
                    <ul class="options-list" id="weight-options">

                    </ul>
                </div>

                <div class="product-card_meta">
                    <span class="article" id="product-article">арт. </span>
                </div>

                <div class="product-card_price-block">
                    <span class="price" id="price"></span>
                    <span class="old-price" id="old-price"></span>
                </div>

                <button class="btn-add-to-cart" id="add-to-cart">В корзину +</button>
                <div class="note">Подготовим товар для Вас</div>
            </div>
        </article>

        <section class="product-description">
            <div class="description-block description">
                
            </div>

            <div class="description-block composition">
                
            </div>

            <div class="description-block taste">
                
            </div>

            <div class="description-block benefits">
                
            </div>
        </section>
    </main>
    
</body>
</html>
